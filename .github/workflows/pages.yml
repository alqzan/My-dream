name: Deploy to GitHub Pages

# main هو المصدر الوحيد للنشر — الفروع الأخرى للتطوير فقط.
# (سبب هذا القيد: تعدد فروع النشر سبق أن جعل نشراً من فرع قديم
# يستبدل النسخة الكاملة الحية.)
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Quality gate — a red check blocks the deploy (main is the only publish
      # source, so nothing broken reaches the live site). Order is cheapest-first
      # so an obvious failure fails fast before the slower build.
      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Application typecheck
        run: npm run typecheck

      # Firestore/Storage rules tests run against the real rules engine via the
      # local emulators. A rules failure must block a deploy: this is the
      # candidate contract for the additive shard paths, even though publishing
      # production rules remains a separate Firebase-console action.
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        id: setup-java
        with:
          distribution: temurin
          java-version: "21"

      - name: Firebase rules tests
        run: npm run test:rules

      - name: Worker typecheck
        working-directory: cloudflare-worker
        run: |
          npm ci
          npm run typecheck

      - name: Worker runtime tests
        run: npx vitest run cloudflare-worker/src/index.test.ts

      - name: Build static site (with base path for project pages)
        env:
          BASE_PATH: /My-dream
          # Shown in the Data Health card so a device's running build is
          # identifiable while diagnosing sync — replaces the hand-bumped tag.
          NEXT_PUBLIC_BUILD_TAG: ${{ github.sha }}
          # Cloud sync activates automatically once these repo secrets are
          # set (Settings → Secrets and variables → Actions). Empty secrets
          # keep Firebase disabled and the app fully on-device.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          # Public Worker URL (Repository variable, not a secret), e.g.
          # https://madar-r2-gateway.<subdomain>.workers.dev
          NEXT_PUBLIC_R2_WORKER_URL: ${{ vars.NEXT_PUBLIC_R2_WORKER_URL }}
        run: npm run build

      - name: Disable Jekyll (needed for Next.js _next folder)
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
