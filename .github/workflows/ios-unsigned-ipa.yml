name: iOS free trial IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native web bundle
        env:
          NEXT_PUBLIC_BUILD_TAG: ${{ github.sha }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_R2_WORKER_URL: ${{ vars.NEXT_PUBLIC_R2_WORKER_URL }}
        run: npm run build:native

      - name: Sync Capacitor iOS project
        run: CAPACITOR_WEB_DIR=out-native npx cap sync ios

      - name: Read app build number
        shell: bash
        run: |
          app_build="$(node -e 'const fs = require("node:fs"); const source = fs.readFileSync("src/lib/version.ts", "utf8"); const match = source.match(/export const APP_BUILD = (\d+);/); if (!match) process.exit(1); process.stdout.write(match[1]);')"
          echo "APP_BUILD=$app_build" >> "$GITHUB_ENV"

      - name: Archive without code signing
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Madar.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CURRENT_PROJECT_VERSION="$APP_BUILD"
          MARKETING_VERSION="0.1.$APP_BUILD"
          archive

      - name: Package unsigned IPA
        id: package
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/Madar.xcarchive/Products/Applications/App.app"
          payload_path="$RUNNER_TEMP/ipa-payload"
          ipa_path="$RUNNER_TEMP/Madar-${APP_BUILD}.ipa"

          test -d "$app_path"
          rm -rf "$payload_path"
          mkdir -p "$payload_path/Payload"
          ditto "$app_path" "$payload_path/Payload/App.app"
          ditto -c -k --norsrc --noextattr --noqtn --noacl --keepParent "$payload_path/Payload" "$ipa_path"

          echo "path=$ipa_path" >> "$GITHUB_OUTPUT"
          echo "name=Madar-${APP_BUILD}.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14
