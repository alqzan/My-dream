name: Upload iOS build to TestFlight

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Check required secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          missing=()
          for key in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 CERT_P12 CERT_PASSWORD PROVISIONING_PROFILE; do
            if [[ -z "${!key}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} )); then
            echo "Missing GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build native web assets and sync Capacitor
        env:
          NEXT_PUBLIC_BUILD_TAG: ${{ github.sha }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_R2_WORKER_URL: ${{ vars.NEXT_PUBLIC_R2_WORKER_URL }}
        run: |
          npm run build:native
          CAPACITOR_WEB_DIR=out-native npx cap sync ios

      - name: Install distribution certificate and provisioning profile
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          certificate="$RUNNER_TEMP/distribution.p12"
          profile="$RUNNER_TEMP/distribution.mobileprovision"
          keychain="$RUNNER_TEMP/madar-signing.keychain-db"
          printf '%s' "$CERT_P12" | base64 --decode > "$certificate"
          printf '%s' "$PROVISIONING_PROFILE" | base64 --decode > "$profile"
          security cms -D -i "$profile" -o "$RUNNER_TEMP/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          team_id=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          profile_app_id=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          if [[ "$profile_app_id" != "$team_id.com.alqzan.madar" ]]; then
            echo 'PROVISIONING_PROFILE must target com.alqzan.madar.' >&2
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "TEAM_ID=$team_id" >> "$GITHUB_ENV"

      - name: Archive signed app
        run: |
          app_build=$(sed -nE 's/^export const APP_BUILD = ([0-9]+);/\1/p' src/lib/version.ts)
          if [[ -z "$app_build" ]]; then echo 'APP_BUILD is missing.' >&2; exit 1; fi
          echo "APP_BUILD=$app_build" >> "$GITHUB_ENV"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Madar.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$app_build" \
            MARKETING_VERSION="0.1.$app_build"

      - name: Export App Store Connect IPA
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          options = {
              'method': 'app-store-connect',
              'destination': 'export',
              'signingStyle': 'manual',
              'signingCertificate': 'Apple Distribution',
              'teamID': os.environ['TEAM_ID'],
              'provisioningProfiles': {'com.alqzan.madar': os.environ['PROFILE_NAME']},
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'ExportOptions.plist'), 'wb') as stream:
              plistlib.dump(options, stream)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Madar.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/MadarExport"
          test -f "$RUNNER_TEMP/MadarExport/App.ipa"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          xcrun altool --upload-app \
            --file "$RUNNER_TEMP/MadarExport/App.ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove temporary signing material
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          security delete-keychain "$RUNNER_TEMP/madar-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [[ -n "$ASC_KEY_ID" ]]; then rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"; fi
