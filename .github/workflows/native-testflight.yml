name: Native iOS to TestFlight

# يرفع نسخة «مدار» الأصليّة (SwiftUI) إلى TestFlight. يدويّ، ويحتاج أسرار Apple
# نفسها التي يستعملها سير Capacitor، إلّا ملفّ التوقيع: هذا التطبيق بمعرّفٍ آخر
# (`com.alqzan.madar.native`) فله `NATIVE_PROVISIONING_PROFILE` مستقلّ.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check required secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          NATIVE_PROVISIONING_PROFILE: ${{ secrets.NATIVE_PROVISIONING_PROFILE }}
        run: |
          missing=()
          for key in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 CERT_P12 CERT_PASSWORD NATIVE_PROVISIONING_PROFILE; do
            if [[ -z "${!key}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} )); then
            echo "Missing GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install certificate and profile
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          PROFILE: ${{ secrets.NATIVE_PROVISIONING_PROFILE }}
        run: |
          certificate="$RUNNER_TEMP/distribution.p12"
          profile="$RUNNER_TEMP/native.mobileprovision"
          keychain="$RUNNER_TEMP/madar-native.keychain-db"
          printf '%s' "$CERT_P12" | base64 --decode > "$certificate"
          printf '%s' "$PROFILE" | base64 --decode > "$profile"
          security cms -D -i "$profile" -o "$RUNNER_TEMP/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          team_id=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          app_id=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          if [[ "$app_id" != "$team_id.com.alqzan.madar.native" ]]; then
            echo 'NATIVE_PROVISIONING_PROFILE must target com.alqzan.madar.native.' >&2
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          pw=$(openssl rand -hex 24)
          security create-keychain -p "$pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pw" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "TEAM_ID=$team_id" >> "$GITHUB_ENV"

      - name: Archive signed app
        run: |
          xcodebuild archive \
            -project MadarNative.xcodeproj \
            -scheme Madar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MadarNative.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export IPA
        run: |
          python3 - <<'PY'
          import os, plistlib
          options = {
              'method': 'app-store-connect', 'destination': 'export', 'signingStyle': 'manual',
              'signingCertificate': 'Apple Distribution', 'teamID': os.environ['TEAM_ID'],
              'provisioningProfiles': {'com.alqzan.madar.native': os.environ['PROFILE_NAME']},
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'ExportOptions.plist'), 'wb') as f:
              plistlib.dump(options, f)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MadarNative.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/Export"
          ls "$RUNNER_TEMP/Export"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"; chmod 700 "$key_dir"
          printf '%s' "$ASC_KEY_P8" > "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --file "$RUNNER_TEMP/Export/Madar.ipa" --type ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove signing material
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          security delete-keychain "$RUNNER_TEMP/madar-native.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/native.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [[ -n "$ASC_KEY_ID" ]]; then rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"; fi
