name: Native iOS (SwiftUI)

# يبني نسخة «مدار» الأصليّة (`native/`) ويختبرها على محاكٍ، ثمّ يُخرج IPA غير
# موقّع يُثبَّت بـAltStore/SideStore بحسابٍ مجاني. لا أسرار ولا توقيع هنا.
on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/native-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [(rt, d) for rt, ds in devices.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          ios.sort(key=lambda x: x[0])
          print(ios[-1][1]["udid"])')
          echo "SIM_ID=$id" >> "$GITHUB_ENV"

      - name: Test
        run: >-
          xcodebuild test
          -project MadarNative.xcodeproj
          -scheme Madar
          -destination "id=$SIM_ID"
          CODE_SIGNING_ALLOWED=NO

      - name: Archive without code signing
        run: >-
          xcodebuild archive
          -project MadarNative.xcodeproj
          -scheme Madar
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Madar.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Madar.xcarchive/Products/Applications/Madar.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/Madar.app"
          ditto -c -k --norsrc --noextattr --noqtn --noacl --keepParent "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/MadarNative-${{ github.run_number }}.ipa"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MadarNative-${{ github.run_number }}.ipa
          path: ${{ runner.temp }}/MadarNative-${{ github.run_number }}.ipa
          if-no-files-found: error
          retention-days: 14
