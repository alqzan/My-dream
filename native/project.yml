# مشروع «مدار» الأصليّ (SwiftUI). يُولَّد ملفّ Xcode منه بـXcodeGen في CI،
# فلا يُحفظ `.xcodeproj` في المستودع ولا تقع تعارضاتُه.
#     brew install xcodegen && xcodegen generate
name: MadarNative
options:
  bundleIdPrefix: com.alqzan
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Madar:
    type: application
    platform: iOS
    sources: [Madar]
    settings:
      base:
        # معرّفٌ مختلف عن نسخة Capacitor (`com.alqzan.madar`) عمداً: التثبيتُ
        # فوقها يستبدلها ويمسح بياناتها قبل أن تُنقل.
        PRODUCT_BUNDLE_IDENTIFIER: com.alqzan.madar.native
        PRODUCT_NAME: Madar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: مدار
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "لحساب مواقيت الصلاة في مدينتك."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "لإرفاق صورٍ بمذكراتك."
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  MadarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MadarTests]
    dependencies:
      - target: Madar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.alqzan.madar.native.tests
schemes:
  Madar:
    build:
      targets:
        Madar: all
        MadarTests: [test]
    test:
      targets: [MadarTests]
