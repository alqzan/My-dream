name = "madar-r2-gateway"
main = "src/index.ts"
compatibility_date = "2026-07-20"

[vars]
R2_BUCKET_NAME = "madar-media"
# أصلٌ واحد للإنتاج. أصولُ التطوير (localhost) تُضاف في `.dev.vars` محلياً لا
# هنا: كلُّ أصلٍ في القائمة المنشورة يسمح لأيّ صفحةٍ تُخدَم منه بقراءة ردود
# الوسيط. الرموزُ تحرس المسارات الخاصّة على كلّ حال، لكنّها طبقةٌ تُنزع
# مقابل صفرِ فائدةٍ في الإنتاج.
ALLOWED_ORIGINS = "https://alqzan.github.io"
MAX_IMAGE_BYTES = "8388608"
MAX_PDF_BYTES = "33554432"
MAX_AUDIO_BYTES = "33554432"
UPLOAD_URL_TTL_SECONDS = "120"
# Runtime clamps signed download links to 1–7 days; keep the deployed config
# explicit so this value is not misleadingly shorter than the actual policy.
DOWNLOAD_URL_TTL_SECONDS = "86400"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "madar-media"
